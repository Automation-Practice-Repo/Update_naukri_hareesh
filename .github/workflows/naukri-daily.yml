name: Naukri Daily Profile Update

on:
  schedule:
    # Runs daily at 9:00 AM IST (3:30 UTC)
    # IST = UTC+5:30, so 9:00 IST = 3:30 UTC
    - cron: '30 3 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  naukri-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pytest pyyaml requests
          playwright install chromium
          playwright install-deps chromium

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          NAUKRI_URL=https://www.naukri.com/
          NAUKRI_USERNAME=${{ secrets.NAUKRI_USERNAME }}
          NAUKRI_PASSWORD=${{ secrets.NAUKRI_PASSWORD }}
          HEADLESS=true
          TIMEOUT=30000
          TELEGRAM_ENABLED=true
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          EOF

      - name: Run Naukri tests
        run: |
          python -m pytest tests/test_naukri_update.py -v --tb=short

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-screenshots
          path: reports/screenshots/fail/
          retention-days: 7

      - name: Upload screenshots on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: naukri-screenshots
          path: reports/screenshots/pass/
          retention-days: 7

      - name: Send Telegram notification on failure
        if: failure()
        run: |
          python -c "
          import requests
          import os
          token = '${{ secrets.TELEGRAM_BOT_TOKEN }}'
          chat_id = '${{ secrets.TELEGRAM_CHAT_ID }}'
          msg = f'❌ Naukri GitHub Actions run failed at ${{ github.run_id }}'
          requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat_id, 'text': msg})
          "

      - name: Send Telegram notification on success
        if: success()
        run: |
          python -c "
          import requests
          import os
          token = '${{ secrets.TELEGRAM_BOT_TOKEN }}'
          chat_id = '${{ secrets.TELEGRAM_CHAT_ID }}'
          msg = f'✅ Naukri GitHub Actions run passed at ${{ github.run_id }}'
          requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat_id, 'text': msg})
          "